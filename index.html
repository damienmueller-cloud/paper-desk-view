<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Desk</title><style>
body{margin:0;font:15px -apple-system,system-ui,sans-serif;background:#0d1117;color:#e6edf3}
.ban{background:#d29922;color:#000;text-align:center;font-weight:700;padding:8px;letter-spacing:1px;position:sticky;top:0}
.w{padding:12px;max-width:640px;margin:auto}.c{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:13px;color:#8b949e;text-transform:uppercase;margin:0 0 8px}.big{font-size:32px;font-weight:700}
.g{color:#3fb950}.r{color:#f85149}.m{color:#8b949e;font-size:12px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #21262d}
.row:last-child{border:0}a{color:#58a6ff}svg{width:100%;height:140px}.pill{font-size:11px;padding:2px 6px;border-radius:8px;background:#30363d}
</style></head><body><div class="ban">PRACTICE MODE, FAKE MONEY · READ-ONLY VIEW</div><div class="w">
<div class="c"><h2>Equity</h2><div class="big" id="eq">…</div><div id="pl"></div><div class="m" id="sub"></div></div>
<div class="c"><h2>Equity curve</h2><svg id="cv" viewBox="0 0 300 140" preserveAspectRatio="none"></svg></div>
<div class="c"><h2>Open position</h2><div id="op"></div></div>
<div class="c"><h2>Recent trades</h2><div id="tr"></div></div>
<div class="c"><h2>Rejections by check (<span id="rt"></span> total, <span id="rr"></span> recent)</h2><div id="rj"></div></div>

<div class="m" id="up" style="text-align:center"></div></div>
<script>
const $=i=>document.getElementById(i),f=(x,d=2)=>x==null?'—':Number(x).toFixed(d),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=ts=>ts?new Date(ts*1000).toLocaleString('en-PH',{timeZone:'Asia/Manila'}):'';const cl=v=>v>=0?'g':'r';
let cur=null,et=null,apiNext=0;
const API='https://api.github.com/repos/damienmueller-cloud/paper-desk-view/contents/state.json';
async function getPages(){const r=await fetch('state.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
async function getApi(){if(Date.now()<apiNext)return null;apiNext=Date.now()+75000;
 const h={Accept:'application/vnd.github.raw'};if(et)h['If-None-Match']=et;
 const r=await fetch(API,{headers:h,cache:'no-store'});
 if(r.status==304)return null;if(!r.ok){if(r.status==403||r.status==429)apiNext=Date.now()+600000;return null}
 et=r.headers.get('ETag');return r.json()}
async function poll(){if(document.hidden)return;const rs=await Promise.allSettled([getApi(),getPages()]);
 let ok=false;for(const x of rs)if(x.status=='fulfilled'&&x.value){ok=true;if(!cur||(x.value.updated_ts||0)>=(cur.updated_ts||0))cur=x.value}
 if(cur)render(cur);else if(!ok)$('up').textContent='connection lost, retrying…'}
function tick(){if(!cur)return;const s=Math.max(0,Math.round(Date.now()/1000-cur.updated_ts));
 $('up').innerHTML=`<span style="color:${s<120?'#3fb950':'#d29922'}">●</span> ${s<120?'live':'delayed'} · updated ${s<60?s+'s':Math.floor(s/60)+'m '+(s%60)+'s'} ago (${e(cur.updated_manila)}) · Practice mode, fake money`}
function render(s){try{
$('eq').textContent='$'+f(s.equity);const d=s.equity-s.start;$('pl').innerHTML=`<span class="${cl(d)}">${d>=0?'+':''}$${f(d)} (${f(d/s.start*100)}%)</span> vs US$${f(s.start)} start`;
$('sub').textContent=`cash $${f(s.cash)} · ${s.trades_n} trades · realized $${f(s.closed?.pnl)} · practice mode, fake money`;
const c=s.curve.map(p=>p.equity).concat([s.equity]);const mn=Math.min(...c,s.start),mx=Math.max(...c,s.start),sc=v=>130-(v-mn)/((mx-mn)||1)*120;
const pts=c.map((v,i)=>`${i/((c.length-1)||1)*300},${sc(v)}`).join(' ');
$('cv').innerHTML=`<line x1=0 x2=300 y1=${sc(s.start)} y2=${sc(s.start)} stroke="#484f58" stroke-dasharray="4"/><polyline points="${pts}" fill="none" stroke="#3fb950" stroke-width="2"/>`;
$('op').innerHTML=s.open.length?s.open.map(p=>{const u=(p.last_px/p.entry_px-1)*100;return `<div class="row"><div><b>${e(p.symbol)}</b> <span class="pill">${e(p.chain)}</span><div class="m">${e(p.reason_open)}</div></div><div class="${cl(u)}">${f(u,1)}%<div class="m">$${f(p.cost)}</div></div></div>`}).join(''):'<div class="m">flat</div>';
$('tr').innerHTML=s.trades.map(p=>`<div class="row"><div><b>${e(p.symbol)}</b> <span class="pill">${e(p.status)}</span><div class="m">in: ${e(p.reason_open)}${p.reason_close?'<br>out: '+e(p.reason_close):''}</div><div class="m">${t(p.opened)}</div></div><div class="${cl(p.pnl||0)}">${p.pnl==null?'open':'$'+f(p.pnl)}</div></div>`).join('')||'<div class="m">none</div>';
$('rt').textContent=s.rej_total;$('rr').textContent=s.recent_rejections;$('rj').innerHTML=s.rej.map(r=>`<div class="row"><span>${e(r.check_name)}</span><b>${r.n}</b></div>`).join('')||'<div class="m">none</div>';

tick();}catch(err){}}
poll();setInterval(poll,20000);setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});;</script></body></html>
